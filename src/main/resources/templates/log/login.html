<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录日志分析</title>
    <link rel="stylesheet" href="/layui/css/layui.css" />
    <link rel="stylesheet" href="/layui/layuiAdmin/css/admin.css" />
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <!-- 顶部搜索栏 -->
        <div class="layui-card-header layuiadmin-card-header-auto" style="border-radius: 0; border-top: 4px solid #d2d2d2;">
            <form class="layui-form" lay-filter="searchForm">
                <div class="layui-form-item" style="margin-bottom:0;">
                    <div class="layui-inline" style="width: 120px;">
                        <select name="searchType" lay-filter="searchType" disabled>
                            <option value="mac" selected>MAC地址</option>
                        </select>
                    </div>
                    <div class="layui-inline" style="width: 300px;">
                        <input type="text" name="keywords" placeholder="请输入搜索内容" autocomplete="off" class="layui-input">
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn layuiadmin-btn-useradmin" lay-submit lay-filter="login-log-search">
                            <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 按钮区与表格 -->
        <div class="layui-card-body">
            <div style="padding-bottom: 10px;">
                <button class="layui-btn layuiadmin-btn-useradmin" data-type="refresh">刷新</button>
                <button class="layui-btn layuiadmin-btn-useradmin" data-type="sync">同步</button>
            </div>
            <table id="login-log-table" lay-filter="login-log-table"></table>
        </div>
    </div>
</div>

<script src="/layui/layui.js"></script>
<script type="text/javascript" th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        const table = layui.table;
        const form = layui.form;
        const layer = layui.layer;
        const $ = layui.$;

        // 表格初始化
        table.render({
            elem: '#login-log-table',
            method: 'post',
            url: '/logs/login',
            contentType: 'application/json',
            headers: {
                'Authorization': localStorage.getItem('token'),
                'userId': localStorage.getItem('id')
            },
            title: '登录日志风险分析',
            cellMinWidth: 100,
            page: true,
            request: {
                pageName: 'page',
                limitName: 'limit'
            },
            parseData: function (res) {
                return {
                    code: res.code,
                    msg: res.msg,
                    count: res.count,
                    data: res.data
                };
            },
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'mac', title: 'MAC地址', width: 160},
                {field: 'username', title: '用户名', width: 120},
                {field: 'loginTime', title: '登录时间', width: 180},
                {
                    field: 'loginRisk',
                    title: '登录风险',
                    minWidth: 180,
                    templet: function(d) {
                        let html = '';
                        if (d.isRiskUser) {
                            html += '<button class="layui-btn layui-btn-xs layui-btn-danger" style="margin-right:5px;">危险用户登录</button>';
                        }
                        if (d.isRiskTime) {
                            html += '<button class="layui-btn layui-btn-xs layui-btn-warm">非正常时间登录</button>';
                        }
                        if (!d.isRiskUser && !d.isRiskTime) {
                            html = '无风险';
                        }
                        return html;
                    }
                }
            ]]
        });

        // 搜索功能
        form.on('submit(login-log-search)', function (data) {
            const mac = data.field.keywords;
            table.reload('login-log-table', {
                where: {mac: mac},
                page: {curr: 1}
            });
            return false;
        });

        // 同步 & 刷新功能
        const active = {
            sync: function () {
                layer.load(1, {shade: [0.1, '#fff']});
                $.ajax({
                    url: '/logs/login/sync',
                    type: 'POST',
                    headers: {
                        'Authorization': localStorage.getItem('token'),
                        'userId': localStorage.getItem('id')
                    },
                    success: function (res) {
                        console.log("loginres:",res);
                        layer.closeAll('loading');
                        if (res.code === 0) {
                            layer.msg('同步成功，数据将自动刷新');
                            table.reload('login-log-table');
                        } else {
                            layer.msg('同步失败：' + res.msg, {icon: 2});
                        }
                    },
                    error: function () {
                        layer.closeAll('loading');
                        layer.msg('同步请求失败', {icon: 2});
                    }
                });
            },
            refresh: function () {
                $('form[lay-filter="searchForm"] input[name="keywords"]').val(''); // 清空搜索框
                table.reload('login-log-table', {
                    where: {},
                    page: { curr: 1 }
                });
            }
        };

        $('.layuiadmin-btn-useradmin').on('click', function () {
            const type = $(this).data('type');
            if (active[type]) active[type]();
        });
    });
</script>
</body>
</html>
