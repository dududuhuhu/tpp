<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>账号变更日志分析</title>
    <link rel="stylesheet" href="/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="/layui/layuiAdmin/css/admin.css" media="all">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <!-- 搜索栏 -->
        <div class="layui-card-header layuiadmin-card-header-auto" style="border-radius: 0; border-top: 4px solid #d2d2d2;">
            <form class="layui-form" lay-filter="searchForm">
                <div class="layui-form-item" style="margin-bottom:0;">
                    <div class="layui-inline">
                        <select name="searchType" lay-filter="searchType">
                            <option value="mac">MAC地址</option>
                        </select>
                    </div>
                    <div class="layui-inline">
                        <input type="text" name="keywords" placeholder="请输入搜索内容" autocomplete="off" class="layui-input">
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn layuiadmin-btn-useradmin" lay-submit lay-filter="LAY-baseline-search">
                            <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 按钮区和表格 -->
        <div class="layui-card-body">
            <div style="padding-bottom: 10px;">
                <button class="layui-btn layuiadmin-btn-useradmin" data-table="baseline" data-type="refresh">刷新</button>
                <button class="layui-btn layuiadmin-btn-useradmin" data-table="baseline" data-type="sync">同步</button>
                <button id="btn-ai-analyze" class="layui-btn layui-btn-normal layuiadmin-btn-useradmin layui-btn-disabled" data-table="baseline" data-type="AI" disabled>AI辅助分析</button>
            </div>
            <table id="LAY-baseline-manage" lay-filter="LAY-baseline-manage"></table>
        </div>
    </div>
</div>

<script src="/layui/layui.js"></script>
<script src="/js/reportUtils.js"></script>  <!-- 确保路径正确 -->

<script>
    function padZero(n) {
        return n < 10 ? '0' + n : n;
    }
    function formatDate(str) {
        if (str != null) {
            const d = new Date(str);
            const year = d.getFullYear();
            const month = padZero(d.getMonth() + 1);
            const date = padZero(d.getDate());
            const hour = padZero(d.getHours());
            const minute = padZero(d.getMinutes());
            const second = padZero(d.getSeconds());
            return `${year}-${month}-${date} ${hour}:${minute}:${second}`;
        }
        return '';
    }
</script>

<script type="text/javascript" th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        var table = layui.table,
            form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        // 全局变量，记录当前已搜索的MAC
        var searchedMac = null;

        // 渲染表格
        table.render({
            elem: '#LAY-baseline-manage',
            method: 'post',
            url: '/logs/accountChange',
            contentType: 'application/json',
            headers: {
                'Authorization': localStorage.getItem('token'),
                'userId': localStorage.getItem('id')
            },
            title: '账号变更日志探测结果',
            cellMinWidth: 80,
            where: {},
            page: { curr: 1, limit: 5 },
            limits: [5, 10, 15, 20],
            request: {
                pageName: 'page',
                limitName: 'limit'
            },
            parseData: function (res) {
                return {
                    code: res.code,
                    msg: res.msg,
                    count: res.count,
                    data: res.data
                };
            },
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'id', title: 'ID', width: 80, hide: true},
                {field: 'mac', title: 'MAC地址', width: 150},
                {field: 'eventTime', title: '事件时间', width: 160, templet: d => formatDate(d.eventTime)},
                {
                    field: 'eventId',
                    title: '事件ID',
                    width: 80,
                    templet: function (d) {
                        return `<button class="layui-btn layui-btn-xs layui-btn-warm">${d.eventId}</button>`;
                    }
                },
                {
                    field: 'targetUser',
                    title: '被操作用户',
                    width: 100,
                    templet: function (d) {
                        return `<span class="layui-badge layui-bg-green">${d.targetUser || '-'}</span>`;
                    }
                },
                {
                    field: 'operatorUser',
                    title: '操作用户',
                    width: 100,
                    templet: function (d) {
                        return `<span class="layui-badge layui-bg-blue">${d.operatorUser || '-'}</span>`;
                    }
                },
                {field: 'action', title: '操作描述', minWidth: 471}
            ]]
        });

        // 定义统一事件处理对象
        var active = {
            AI: function () {
                if (!searchedMac) {
                    return layer.msg('请先通过 MAC 地址进行搜索后再使用 AI 辅助分析');
                }
                var checkStatus = table.checkStatus('LAY-baseline-manage');
                var data = checkStatus.data;
                if (data.length === 0) {
                    return layer.msg('请至少选择一条记录');
                }
                var mac = data[0].mac;

                var $btn = $('#btn-ai-analyze');
                $btn.attr('disabled', true).addClass('layui-btn-disabled');

                $.ajax({
                    url: '/api/report/acct-chg/analyze',
                    method: 'POST',
                    headers: {
                        'Authorization': localStorage.getItem('token'),
                        'userId': localStorage.getItem('id')
                    },
                    contentType: 'application/json',
                    data: JSON.stringify({mac: mac}),
                    success: function (res) {
                        layer.closeAll('loading');
                        if (res && res.overall_risk_level) {
                            const data = res;

                            // 构造 HTML（整合图表容器和文字报告）
                            let html = `
                    <div style="padding: 20px; font-size: 14px;">
                        <h2 style="margin-bottom: 10px;">📊 风险分析报告</h2>
                       <div style="display: flex; gap: 16px; margin-bottom: 20px;">
                            <!-- 整体风险等级卡片 -->
                            <div style="flex: 1; background: #fff5f5; border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between;">
                                <div>
                                    <div style="font-size: 26px; color: #e74c3c;">${data.overall_risk_level}</div>
                                    <div style="color: #e74c3c; font-weight: bold;">🔴 整体风险等级</div>
                                </div>
                                <div style="font-size: 28px;">📊</div>
                            </div>

                            <!-- 高风险事件数卡片 -->
                            <div style="flex: 1; background: #fffaf0; border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between;">
                                <div>
                                    <div style="font-size: 26px; color: #f39c12;">${data.high_risk_event_count}</div>
                                    <div style="color: #f39c12; font-weight: bold;">📌 高风险事件数</div>
                                </div>
                                <div style="font-size: 28px;">📍</div>
                            </div>
                        </div>

                        <div id="risk-chart" style="width: 100%; height: 250px; margin-top: 20px;"></div>
                        <div id="freq-chart" style="width: 100%; height: 250px; margin-top: 20px;"></div>

                        <h3 style="margin-top: 30px;">📌 高风险事件</h3>
                        ${data.high_risk_events.map(e => `
                            <div style="background: #f9f9f9; padding: 10px 15px; margin: 10px 0; border-left: 5px solid #e74c3c; border-radius: 6px;">
                                <p><strong>事件ID：</strong>${e.event_id} | <strong>评分：</strong>${e.risk_score}</p>
                                <p><strong>操作：</strong>${e.action}</p>
                                <p><strong>描述：</strong>${e.risk_description}</p>
                                <p><strong>时间：</strong>${e.event_time}</p>
                                <p><strong>目标用户：</strong>${e.target_user} | <strong>操作者：</strong>${e.operator_user}</p>
                            </div>
                        `).join('')}



                        <h3 style="margin-top: 30px;">📝 风险描述</h3>
                        <p>${data.risk_description}</p>

                        <h3 style="margin-top: 30px;">✅ 建议措施</h3>
                        <p>${data.suggested_action}</p>
                    </div>
                `;

                            // 打开弹窗 + 图表渲染
                            layer.open({
                                type: 1,
                                title: 'AI 风险分析报告',
                                area: ['780px', '650px'],
                                shadeClose: true,
                                content: `<div style="max-height: 580px; overflow-y: auto;">${html}</div>`,
                                success: function () {
                                    const riskChart = echarts.init(document.getElementById('risk-chart'));
                                    riskChart.setOption({
                                        title: {text: '风险评分分布', left: 'center'},
                                        tooltip: {},
                                        xAxis: {
                                            type: 'category',
                                            data: data.risk_scores.map(r => r.event_id),
                                            name: '事件ID'
                                        },
                                        yAxis: {
                                            type: 'value',
                                            name: '评分',
                                            max: 10
                                        },
                                        series: [{
                                            data: data.risk_scores.map(r => r.risk_score),
                                            type: 'bar',
                                            itemStyle: {color: '#e74c3c'}
                                        }]
                                    });

                                    const freqChart = echarts.init(document.getElementById('freq-chart'));
                                    freqChart.setOption({
                                        title: {text: '用户操作频率', left: 'center'},
                                        tooltip: {trigger: 'item'},
                                        legend: {bottom: '0%'},
                                        series: [{
                                            type: 'pie',
                                            radius: '55%',
                                            data: data.operation_frequencies.map(f => ({
                                                name: f.user,
                                                value: f.frequency
                                            })),
                                            label: {
                                                formatter: '{b}: {c}次 ({d}%)'
                                            }
                                        }]
                                    });
                                }
                            });
                        } else {
                            layer.msg('AI分析失败：数据异常', {icon: 2});
                        }
                    },
                    error: function () {
                        layer.closeAll('loading');
                        layer.msg('AI分析请求失败', {icon: 2});
                    },
                    complete: function () {
                        $btn.attr('disabled', false).removeClass('layui-btn-disabled');
                    }
                });
            },
            sync:function (){
                layer.load(1, { shade: [0.1, '#fff'] });
                $.ajax({
                    url: '/logs/accountChange/sync',
                    type: 'POST',
                    headers: {
                        'Authorization': localStorage.getItem('token'),
                        'userId': localStorage.getItem('id')
                    },
                    success: function (res) {
                        layer.closeAll('loading');
                        if (res.code === 0) {
                            layer.msg('同步请求已发送，稍后自动刷新数据');
                        } else {
                            layer.msg('同步失败：' + res.msg, { icon: 2 });
                        }
                    },
                    error: function () {
                        layer.closeAll('loading');
                        layer.msg('同步请求失败', { icon: 2 });
                    }
                });
            },
            refresh: function () {
                $('input[name="keywords"]').val('');
                searchedMac = null;
                $('#btn-ai-analyze').addClass('layui-btn-disabled').attr('disabled', true);
                table.reload('LAY-baseline-manage', {
                    where: {},
                    page: { curr: 1 }
                });
            }
        };

        // 搜索表单提交
        form.on('submit(LAY-baseline-search)', function (data) {
            var mac = data.field.keywords.trim();
            console.log("searchedMac:", mac);
            searchedMac = mac ? mac : null;

            table.reload('LAY-baseline-manage', {
                where: {mac: mac},
                page: { curr: 1 }
            });

            if (searchedMac) {
                $('#btn-ai-analyze').removeClass('layui-btn-disabled').attr('disabled', false);
            } else {
                $('#btn-ai-analyze').addClass('layui-btn-disabled').attr('disabled', true);
            }

            return false;
        });

        // 按钮点击统一处理
        $('.layuiadmin-btn-useradmin').on('click', function () {
            var type = $(this).data('type');
            var tableName = $(this).data('table');
            if (tableName === 'baseline' && active[type]) {
                active[type]();
            }
        });

        // 可根据需要添加表格事件处理
    });
</script>
</body>
</html>
