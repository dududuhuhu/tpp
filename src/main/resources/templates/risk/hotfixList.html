<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>安全补丁</title>
    <link rel="stylesheet" href="/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="/layui/layuiAdmin/css/admin.css" media="all">
</head>
<style>
    /* 1. 让 tab 标题容器具有定位上下文 */
    .layui-tab-title {
        border-bottom: 2px solid #e2e2e2;
        position: relative;
    }

    /* 2. 每个 tab 项本身也要能进行绝对定位 */
    .layui-tab-title li {
        position: relative;
        padding: 0 20px; /* 可根据需要调整左右间距 */
        font-size: 16px;
        line-height: 42px;
        font-weight: bold;
    }

    /* 3. 当前选中的 tab 样式 */
    .layui-tab-title li.layui-this {
        color: #16baaa;
        font-weight: bold;
    }

    /* 4. 使用 ::before 添加底部绿色下划线，避免与 layui 的 ::after 冲突 */
    .layui-tab-title li.layui-this::before {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0; /* 贴在底部 */
        width: 100%;
        height: 3px;
        background-color: #16baaa;
        border-radius: 2px;
        z-index: 10;
    }

    /* 5. 清除 Layui 自带的 ::after 样式，防止出现顶部边线 */
    .layui-tab-title li.layui-this::after {
        display: none !important;
    }
</style>

<body>

<!-- 选项卡结构 -->
<div class="layui-tab layui-tab-brief" lay-filter="hostTab">
    <ul class="layui-tab-title">
        <li class="layui-this">安全补丁详情</li>
        <li>安全补丁规则库</li>
    </ul>
    <div class="layui-tab-content">

        <!-- 主机列表 Tab -->
        <div class="layui-tab-item layui-show">
            <div class="layui-fluid">
                <div class="layui-card">
                    <div class="layui-form layui-card-header layuiadmin-card-header-auto" style="border-radius: 0;border-top: 4px solid #d2d2d2;">
                        <div class="layui-form-item">
                            <div class="layui-inline">
                                <select name="searchType" lay-filter="searchType">
                                    <option  value="macAddress">MAC地址</option>
                                </select>
                            </div>
                            <div class="layui-inline">
                                <input type="text" name="keywords" placeholder="请输入搜索内容" autocomplete="off" class="layui-input">
                            </div>
                            <div class="layui-inline">
                                <button class="layui-btn layuiadmin-btn-useradmin" lay-submit lay-filter="LAY-sysuser-front-search">
                                    <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div style="padding-bottom: 10px;">
                            <!-- 主机列表按钮 -->
                            <button class="layui-btn layuiadmin-btn-useradmin" data-table="user" data-type="refresh">刷新</button>
                            <button id="btn-ai-analyze" class="layui-btn layui-btn-normal layuiadmin-btn-useradmin" data-table="user" data-type="AI" disabled>AI辅助分析</button>
                        </div>
                        <table id="LAY-user-manage" lay-filter="LAY-user-manage"></table>

                        <!-- 表格工具栏 -->
                        <script type="text/html" id="table-useradmin-webuser">
                            <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
                        </script>
                    </div>
                </div>
            </div>
        </div>

        <!-- 补丁信息 Tab -->
        <div class="layui-tab-item">
            <div class="layui-fluid">
                <div class="layui-card">
                    <div class="layui-form layui-card-header layuiadmin-card-header-auto" style="border-radius: 0;border-top: 4px solid #d2d2d2;">
                        <div class="layui-form-item">
                            <div class="layui-inline">
                                <select name="searchType" lay-filter="searchType">
                                    <option  value="cve">CVE编号</option>
                                </select>
                            </div>
                            <div class="layui-inline">
                                <input type="text" name="keywords" placeholder="请输入搜索内容" autocomplete="off" class="layui-input">
                            </div>
                            <div class="layui-inline">
                                <button class="layui-btn layuiadmin-btn-useradmin" lay-submit lay-filter="LAY-sysrule-front-search">
                                    <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div style="padding-bottom: 10px;">
                            <!-- 补丁规则按钮 -->
                            <button class="layui-btn layuiadmin-btn-useradmin" data-table="rule" data-type="add">添加</button>
                            <button class="layui-btn layuiadmin-btn-useradmin" data-table="rule" data-type="batchdel">删除</button>
                            <button class="layui-btn layuiadmin-btn-useradmin" data-table="rule" data-type="refresh">刷新</button>
                        </div>
                        <table id="LAY-rule-manage" lay-filter="LAY-rule-manage"></table>

                        <!-- 表格工具栏 -->
                        <script type="text/html" id="table-rule-webuser">
                            <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
                        </script>
                    </div>
                    <div class="layui-card-body">

                    </div>
                </div>
            </div>
        </div>


    </div>
</div>

<!-- Layui 核心 JS -->
<script src="/layui/layui.js"></script>
<script src="/js/reportUtils.js"></script>  <!-- 确保路径正确 -->
<!-- 工具函数：时间格式化 -->
<script>
    function formatDate(str) {
        if(str != null){
            var now = new Date(str);
            var year = now.getFullYear();
            var month = now.getMonth() + 1;
            var date = now.getDate();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            return year + "-" + month + "-" + date +" "+hours+":"+minutes+":"+seconds;
        }
        return "";
    }
</script>

<!-- 页面初始化逻辑 -->
<script type="text/javascript" th:inline="none">
    layui.config({
        base: '/layui/layuiAdmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['layer','table','form','element'], function(){
        var $ = layui.$
            ,form = layui.form
            ,layer = layui.layer
            ,dropdown = layui.dropdown
            ,element=layui.element
            ,table = layui.table;


        // 页面初始化时禁用按钮并移除搜索标记
        $('#btn-ai-analyze').addClass('layui-btn-disabled').attr('disabled', true);
        let searchedMac = null;
        // 初始化表格（只初始化一次）
        table.render({
            elem: '#LAY-user-manage',
            method: 'post',
            url: '/host/dangerousHotfixRisk',
            contentType: 'application/json',
            headers: {
                'Authorization': localStorage.getItem('token'),
                'userId':localStorage.getItem('id')
            },
            where: {}, // 初始空
            request: {
                pageName: 'page',
                limitName: 'limit'
            },
            parseData: function(res){
                return {
                    code: res.code,
                    msg: res.msg,
                    count: res.total,
                    data: res.data
                };
            },
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'macAddress', title: 'MAC地址', width: 160},
                {field: 'hotfixId', title: '补丁编号', width: 130},
                {field: 'cve', title: 'CVE编号', width: 150},
                {field: 'score', title: '评分', width: 80, templet: function (d) {
                        let color = '';
                        let score = parseFloat(d.score);
                        if (score >= 9) color = '#FF5722';
                        else if (score >= 7) color = '#FFB800';
                        else if (score >= 4) color = '#1E9FFF';
                        else color = '#009688';
                        return `<span class="layui-btn layui-btn-xs" style="background-color:${color};">${score}</span>`;
                    }
                }
            ]],
            page: true,
            limits: [5, 10, 20],
            limit: 5
        });

        // 搜索事件绑定
        form.on('submit(LAY-sysuser-front-search)', function(data){
            searchedMac = 1;
            var mac = data.field.keywords;

            table.reload('LAY-user-manage', {
                where: {
                    macAddress: mac
                },
                page: { curr: 1 }
            });

            $('#btn-ai-analyze').removeClass('layui-btn-disabled').attr('disabled', false);
            return false;
        });


        // 规则库
        table.render({
            elem: '#LAY-rule-manage',
            method: 'post',
            url: '/rule/hotfix/list',
            headers: {
                'Authorization': localStorage.getItem('token'),
                'userId':localStorage.getItem('id')
            },
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'id', title: 'ID', width: 54},
                {field: 'cve', title: 'CVE编号', width: 140},
                {
                    field: 'score',
                    title: '评分',
                    width: 65,
                    templet: function (d) {
                        let color = '';
                        let score = parseFloat(d.score);
                        if (score >= 9) {
                            color = '#FF5722'; // 高危 - 橙红
                        } else if (score >= 7) {
                            color = '#FFB800'; // 中危 - 橙黄
                        } else if (score >= 4) {
                            color = '#1E9FFF'; // 低危 - 蓝色
                        } else {
                            color = '#009688'; // 信息 - 青色
                        }
                        return `<span class="layui-btn layui-btn-xs" style="background-color:${color};">${score}</span>`;
                    }
                },
                {field: 'productIdList', title: '产品ID列表', width: 300},
                {field: 'kbList', title: '补丁列表', width: 300,},
                {field: 'cvrfId', title: 'cvrfID', width: 90},
                {field: 'dt', title: '数据日期', width: 130,templet: d => formatDate(d.dt)},
                ,{fixed: 'right', title:'操作', toolbar: '#table-rule-webuser', width:80}
            ]],
            page: { curr: 1, limit: 5 },
            limits: [5, 10, 15, 20]
        });


        table.on('tool(LAY-rule-manage)', function(obj){
            var data = obj.data;
            if(obj.event === 'del'){
                layer.confirm('真的删除吗?', function(index){
                    $.ajax({
                        url:"/rule/hotfix/delete",
                        type:"post",
                        headers: { 'Authorization': localStorage.getItem('token'),
                            'userId':localStorage.getItem('id') },
                        data:{ids:[data.id]},
                        dataType:"json",
                        success:function (res){
                            if(res.code == 0){
                                layer.msg(res.msg);
                                table.reload('LAY-rule-manage');
                                layer.close(index);
                            }else {
                                layer.msg(res.msg,{icon: 5});
                            }
                        }
                    })
                });
            }
        });



        //监听搜索
        form.on('submit(LAY-sysrule-front-search)', function(data){
            var field = data.field;
            //执行重载
            table.reload('LAY-rule-manage', {
                url: '/rule/hotfix/list',
                method: "post",
                headers: {
                    'Authorization': localStorage.getItem('token'),
                    'userId':localStorage.getItem('id')
                },
                data: JSON.stringify(field), // 发送JSON格式的数据
                where: field
            });
        });


        var active = {
            host_AI: function () {
                if (!searchedMac) {
                    return layer.msg('请先通过 MAC 地址进行搜索后再使用 AI 辅助分析');
                }

                var checkStatus = table.checkStatus('LAY-user-manage');
                var data = checkStatus.data;

                if (data.length === 0) {
                    return layer.msg('请至少选择一条主机记录');
                }
                // 只取第一个 MAC 地址
                var mac = data[0].macAddress;

                // 发送 AI 分析请求...
                $.ajax({
                    url: '/api/report/hotfix-risk/analyze',
                    method: 'POST',
                    headers: {
                        'Authorization': localStorage.getItem('token'),
                        'userId': localStorage.getItem('id')
                    },
                    contentType: 'application/json',
                    data: JSON.stringify({ macAddress: mac }),
                    success: function (res) {
                        if (res.code === 0) {
                            reportUtils.showReportDialog('安全补丁风险分析报告', res.data);
                        } else {
                            layer.msg(res.msg || '分析失败', {icon: 5});
                        }
                    },
                    error: function () {
                        layer.msg('请求失败，请检查接口或网络连接', {icon: 2});
                    }
                });
            },
            host_refresh: function(){
                // 清空搜索输入框
                $('input[name="keywords"]').val('');
                // 清空搜索类型（如果需要，也可以清空或重置select）
                $('select[name="searchType"]').val('macAddress');
                form.render('select'); // 重新渲染select，否则界面不会更新
                table.reload('LAY-user-manage', {
                    url: '/host/dangerousHotfixRisk',
                    method: "post",
                    headers: {
                        'Authorization': localStorage.getItem('token'),
                        'userId':localStorage.getItem('id')
                    },
                    where: {},  // 传空对象，重置所有搜索条件
                    page: {curr: 1} // 刷新时重置页码到第一页
                });
                // 禁用按钮并清除搜索标记
                $('#btn-ai-analyze').addClass('layui-btn-disabled').attr('disabled', true);
            },
            // 应用规则相关
            rule_batchdel: function(){
                var checkData = table.checkStatus('LAY-rule-manage').data;
                if(checkData.length == 0){
                    return layer.msg('请选择数据');
                }
                layer.confirm('确定删除吗？', function (){
                    var userIds = checkData.map(item => item.id);
                    $.ajax({
                        url:"/rule/hotfix/delete",
                        type:"post",
                        headers: { 'Authorization': localStorage.getItem('token') },
                        data:{ids:userIds},
                        dataType:"json",
                        success:function (res){
                            if(res.code == 0){
                                layer.msg(res.msg);
                                table.reload('LAY-rule-manage');
                            }else{
                                layer.msg(res.msg,{icon: 5});
                            }
                        }
                    });
                });
            },
            rule_refresh: function(){
                // 清空搜索输入框
                $('input[name="keywords"]').val('');
                // 清空搜索类型（如果需要，也可以清空或重置select）
                $('select[name="searchType"]').val('cve');
                form.render('select'); // 重新渲染select，否则界面不会更新
                table.reload('LAY-rule-manage', {
                    url: '/rule/hotfix/list',
                    method: 'post',
                    headers: {
                        'Authorization': localStorage.getItem('token')
                    },
                    where: {},  // 传空对象，重置所有搜索条件
                    page: {curr: 1} // 刷新时重置页码到第一页
                });
            },
            rule_add: function(){
                layer.open({
                    type: 2,
                    title: '添加规则',
                    skin: 'layui-layer-molv',
                    content: '/page/risk/hotfixAdd',
                    area: ['580px', '600px'],
                    btn: ['确定', '取消'],
                    yes: function (index,layero){
                        var iframeWindow = window['layui-layer-iframe'+ index],
                            submitID = 'LAY-user-front-submit',
                            submit = layero.find('iframe').contents().find('#'+ submitID);
                        iframeWindow.layui.form.on('submit('+ submitID +')', function(data){
                            var field = data.field;
                            $.ajax({
                                url:"/rule/hotfix/save",
                                type:"post",
                                headers: {
                                    'Authorization': localStorage.getItem('token')
                                },
                                data:JSON.stringify(field),
                                contentType: "application/json;charset=utf-8",
                                dataType:"json",
                                success:function (res){
                                    if(res.code === 0){
                                        layer.msg(res.msg);
                                        table.reload('LAY-rule-manage');
                                        layer.close(index);
                                    }else{
                                        layer.msg(res.msg,{icon: 5});
                                    }
                                }
                            })
                        });
                        submit.trigger('click');
                    }
                });
            }
        };


        $('.layuiadmin-btn-useradmin').on('click', function(){
            var type = $(this).data('type');
            var tableName = $(this).data('table'); // "user" or "rule"

            // 根据模块前缀调用不同的方法
            if (tableName === 'user') {
                active['host_' + type] && active['host_' + type]();
            } else if (tableName === 'rule') {
                active['rule_' + type] && active['rule_' + type]();
            }
        });

    });
</script>
</body>
</html>
